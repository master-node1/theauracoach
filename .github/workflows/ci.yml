name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      deployables: ${{ steps.detect.outputs.deployables }}
      code: ${{ steps.detect.outputs.code }}
      docs: ${{ steps.detect.outputs.docs }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: detect
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          deployables=$(node tools/ci/affected-services.mjs "$base" HEAD)
          echo "deployables=$deployables" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$base"...HEAD | grep -qvE '^docs/'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if git diff --name-only "$base"...HEAD | grep -qE '^docs/'; then echo "docs=true" >> "$GITHUB_OUTPUT"; else echo "docs=false" >> "$GITHUB_OUTPUT"; fi
          # The web smoke needs the app, what it imports, dev-auth, and anything the stack is built from.
          if git diff --name-only "$base"...HEAD | grep -qE '^(apps/web/|packages/|tools/dev-auth/|services/(profile-service|api-gateway)/|docker-compose\.yml|pnpm-lock\.yaml|\.github/workflows/)'; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          echo "Deployables affected: $deployables"

  verify:
    name: Lint, types and tests (affected packages)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway CI database on the runner: trust auth, so no credential appears anywhere.
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Build, lint, type-check and test what changed (and what depends on it)
        run: pnpm turbo run build typecheck lint test test:int --affected --concurrency=4

  gateway:
    name: Gateway routes
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.deployables), 'api-gateway')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node services/api-gateway/check-routes.mjs

  images:
    name: Image ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.deployables != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.deployables) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image (pushed to ECR from main once the dev cluster exists)
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t auracoach/${{ matrix.service }}:${{ github.sha }} .
      - name: Scan image for fixable critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          auracoach/${{ matrix.service }}:${{ github.sha }}

  smoke:
    name: Local stack smoke test
    needs: changes
    if: needs.changes.outputs.deployables != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Sign in through the gateway and follow the UserRegistered event
        run: tools/smoke/compose-smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  web-e2e:
    name: Web smoke (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # Shorter than the BFF's 60 s refresh window, so every request exercises refresh.
      DEV_AUTH_ACCESS_TOKEN_TTL: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm turbo run build --filter=@aura/web...
      - name: Install Chromium
        run: pnpm --filter @aura/web exec playwright install --with-deps chromium
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Sign in, Today, admin gate and sign out against the stack
        run: pnpm --filter @aura/web e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - if: always()
        run: docker compose down -v

  api-contract:
    name: OpenAPI lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@1 lint docs/api/openapi.yaml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
