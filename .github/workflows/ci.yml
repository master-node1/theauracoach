name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      deployables: ${{ steps.detect.outputs.deployables }}
      code: ${{ steps.detect.outputs.code }}
      docs: ${{ steps.detect.outputs.docs }}
      web: ${{ steps.detect.outputs.web }}
      helm: ${{ steps.detect.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: detect
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          deployables=$(node tools/ci/affected-services.mjs "$base" HEAD)
          echo "deployables=$deployables" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$base"...HEAD | grep -qvE '^docs/'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if git diff --name-only "$base"...HEAD | grep -qE '^docs/'; then echo "docs=true" >> "$GITHUB_OUTPUT"; else echo "docs=false" >> "$GITHUB_OUTPUT"; fi
          # The web smoke needs the app, what it imports, dev-auth, and anything the stack is built from.
          if git diff --name-only "$base"...HEAD | grep -qE '^(apps/web/|packages/|tools/dev-auth/|services/(profile-service|api-gateway)/|docker-compose\.yml|pnpm-lock\.yaml|\.github/workflows/)'; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          # Charts, values and the catalog they are checked against.
          if git diff --name-only "$base"...HEAD | grep -qE '^(infra/helm/|infra/k3s/|tools/ci/(helm-validate\.sh|check-network-policies\.mjs)|tools/deploy/|tools/smoke/k3d-smoke\.sh|docs/architecture/service-catalog\.md|services/[^/]+/Dockerfile|\.github/workflows/)'; then echo "helm=true" >> "$GITHUB_OUTPUT"; else echo "helm=false" >> "$GITHUB_OUTPUT"; fi
          echo "Deployables affected: $deployables"

  verify:
    name: Lint, types and tests (affected packages)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway CI database on the runner: trust auth, so no credential appears anywhere.
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Build, lint, type-check and test what changed (and what depends on it)
        run: pnpm turbo run build typecheck lint test test:int --affected --concurrency=4

  gateway:
    name: Gateway routes
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.deployables), 'api-gateway')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node services/api-gateway/check-routes.mjs

  images:
    name: Images
    needs: changes
    if: needs.changes.outputs.deployables != '[]'
    # The CD build (arm64, Trivy gate, SBOM) as a dry run: nothing is pushed and no AWS role is used.
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      id-token: write
    with:
      deployables: ${{ needs.changes.outputs.deployables }}
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      push: false

  cd:
    name: CD workflows and scripts (actionlint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (with shellcheck)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: Deploy inputs and release notes
        run: node --test tools/deploy/test/*.test.mjs tools/release/test/*.test.mjs
      - name: Shell syntax
        run: bash -n tools/deploy/*.sh tools/smoke/deploy-smoke.sh

  smoke:
    name: Local stack smoke test
    needs: changes
    # The compose stack has no web container; the web app has its own Playwright smoke.
    if: needs.changes.outputs.deployables != '[]' && needs.changes.outputs.deployables != '["web"]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Sign in through the gateway and follow the UserRegistered event
        run: tools/smoke/compose-smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  web-e2e:
    name: Web smoke (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # Shorter than the BFF's 60 s refresh window, so every request exercises refresh.
      DEV_AUTH_ACCESS_TOKEN_TTL: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm turbo run build --filter=@aura/web...
      - name: Install Chromium
        run: pnpm --filter @aura/web exec playwright install --with-deps chromium
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Sign in, Today, admin gate and sign out against the stack
        run: pnpm --filter @aura/web e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - if: always()
        run: docker compose down -v

  helm:
    name: Helm charts (lint, render, kubeconform, kube-linter, NetworkPolicy check)
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v3.22.1
      KUBECONFORM_VERSION: v0.6.7
      KUBE_LINTER_VERSION: v0.7.1
      YQ_VERSION: v4.44.6
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSfL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" | tar xz -C /tmp && mv /tmp/linux-amd64/helm "$HOME/bin/"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin" kubeconform
          curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/$KUBE_LINTER_VERSION/kube-linter-linux.tar.gz" | tar xz -C "$HOME/bin" kube-linter
          curl -sSfL -o "$HOME/bin/yq" "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" && chmod +x "$HOME/bin/yq"
      - name: Validate charts, values and add-ons (renders only; nothing is applied)
        run: tools/ci/helm-validate.sh --addons
      - name: Dry-run the CD deploy scripts (render only, example inputs, no cluster)
        env:
          K8S_VERSION: 1.36.0
          ORIGIN_VERIFY: ci-placeholder-not-a-secret
          DRY_RUN: '1'
        run: |
          mapfile -t all < <(node tools/ci/affected-services.mjs --all | jq -r '.[]')
          sha=0123456789abcdef0123456789abcdef01234567
          for e in dev staging; do
            OUT="$RUNNER_TEMP/cd/$e" tools/deploy/helm-deploy.sh "$e" "$sha" infra/helm/ci/deploy-inputs.yaml "${all[@]}"
          done
          jq -s '.[0] * .[1]' <(yq -o=json infra/helm/ci/deploy-inputs.yaml) <(yq -o=json infra/helm/ci/deploy-inputs-prod.yaml) > "$RUNNER_TEMP/prod-inputs.json"
          OUT="$RUNNER_TEMP/cd/prod" tools/deploy/helm-deploy.sh prod "$sha" "$RUNNER_TEMP/prod-inputs.json" "${all[@]}"
          for c in nonprod prod; do
            OUT="$RUNNER_TEMP/cd/platform-$c" tools/deploy/install-platform.sh "$c" "infra/helm/ci/platform-inputs-$c.yaml"
          done
          kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/cd"

  k3d-smoke:
    name: Helm k3d smoke (profile-service, optional)
    needs: [changes, helm]
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    # Informational while the chart settles in: a failure here does not block merging (TAC-35 AC 4).
    continue-on-error: true
    env:
      HELM_VERSION: v3.22.1
      K3D_VERSION: v5.8.3
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSfL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" | tar xz -C /tmp && mv /tmp/linux-amd64/helm "$HOME/bin/"
          curl -sSfL -o "$HOME/bin/k3d" "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64" && chmod +x "$HOME/bin/k3d"
      - name: Install the chart for profile-service in a throwaway k3d cluster
        run: tools/smoke/k3d-smoke.sh

  api-contract:
    name: OpenAPI lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@1 lint docs/api/openapi.yaml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
