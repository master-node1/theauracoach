# Continuous delivery from main (TAC-37, deployment-architecture §4): build, scan, push and sign the
# images of the deployables a merge changed, then deploy them to dev and smoke-test them.
# Off until the owner sets the repository variable CD_ENABLED=true (docs/operations/deployment.md,
# "Enabling CD"). While off, each merge only writes a summary of what it would have done.
name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployables:
        description: JSON array of deployables, or "all" (default - what the last commit changed)
        required: false
        default: ''

concurrency:
  group: release-images-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: What to release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      deployables: ${{ steps.plan.outputs.deployables }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: plan
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
          REQUESTED: ${{ inputs.deployables }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$REQUESTED" == all ]]; then
            deployables="$(node tools/ci/affected-services.mjs --all)"
          elif [[ -n "$REQUESTED" ]]; then
            deployables="$REQUESTED"
          else
            # Diff against the last successful run, not just the previous commit: a run that was still
            # queued when a newer merge arrived is superseded (concurrency), and its changes ride along.
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-images.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)"
            [[ -n "$base" ]] || base="$BEFORE"
            if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD~1)"; fi
            echo "Changes since $base"
            deployables="$(node tools/ci/affected-services.mjs "$base" HEAD)"
          fi
          echo "deployables=$deployables" >> "$GITHUB_OUTPUT"
          enabled=false
          [[ "$CD_ENABLED" == true ]] && enabled=true
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          {
            echo "## Release images for \`${GITHUB_SHA:0:12}\`"
            echo
            echo "Deployables: \`$deployables\`"
            echo
            if [[ "$enabled" == true ]]; then
              echo "CD is enabled: building, pushing and signing these images, then deploying them to **dev**."
            else
              echo "**CD is disabled** (repository variable \`CD_ENABLED\` is not \`true\`). Nothing was pushed or deployed."
              echo "When enabled, this run would push \`auracoach/<deployable>:$GITHUB_SHA\` to the non-prod ECR and deploy it to dev."
              echo "See docs/operations/deployment.md, *Enabling CD*."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.deployables != '[]'
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      id-token: write
    with:
      deployables: ${{ needs.plan.outputs.deployables }}
      sha: ${{ github.sha }}
      push: true
      environment: dev

  deploy-dev:
    needs: [plan, images]
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.deployables != '[]'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      sha: ${{ github.sha }}
      deployables: ${{ needs.plan.outputs.deployables }}
