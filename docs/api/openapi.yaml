openapi: 3.1.0
info:
  title: AuraCoach API
  version: 0.1.0-draft
  summary: Design contract for the AuraCoach MVP (Phase 3). Implementation generates this file from Zod contracts in Phase 4.
  description: |
    All endpoints require a Cognito access token unless marked `security: []`.
    User-owned resources return 404 for resources owned by another user.
    Errors use RFC 9457 problem details. See API-guide.md for conventions.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.dev.auracoach.app
    description: Development
  - url: https://api.auracoach.app
    description: Production
security:
  - bearerAuth: []
tags:
  - name: me
    description: Account, profile, preferences, consents, export and deletion
  - name: onboarding
    description: Questionnaire, screening and initial plan creation
  - name: exercises
    description: Exercise library
  - name: workouts
    description: Plans, sessions, sets and substitutions
  - name: nutrition
    description: Foods, logging, targets and alternatives
  - name: meal-plans
    description: Meal plans, recipes and grocery lists
  - name: progress
    description: Measurements, trends and check-ins
  - name: dashboard
    description: Today view
  - name: coach
    description: AI coach conversations and memories
  - name: recommendations
    description: Engine and coach proposals
  - name: notifications
    description: In-app inbox
  - name: admin
    description: Content, configuration, usage and audit (RBAC)
  - name: system
    description: Health checks

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and readiness
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  checks:
                    type: object
                    additionalProperties: { type: string, enum: [ok, degraded, down] }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, profile and onboarding state
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [me]
      operationId: requestAccountDeletion
      summary: Request account deletion (30-day grace period)
      responses:
        '202':
          description: Deletion scheduled
          content:
            application/json:
              schema:
                type: object
                required: [deletionDueAt]
                properties:
                  deletionDueAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/me/restore:
    post:
      tags: [me]
      operationId: restoreAccount
      summary: Cancel a pending deletion
      responses:
        '204': { description: Restored }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/profile:
    patch:
      tags: [me]
      operationId: updateProfile
      summary: Update account and profile fields
      description: |
        Account fields (displayName, timezone, locale) can change at any time. Profile fields need
        the profile that onboarding creates; before that they return 409 PROFILE_NOT_CREATED.
        Changes other services keep a copy of publish one ProfileChanged event; workouts and
        nutrition answer with proposals later, so `proposals` is empty in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated profile and any proposals created
          content:
            application/json:
              schema:
                type: object
                required: [profile, proposals]
                properties:
                  profile:
                    oneOf:
                      - $ref: '#/components/schemas/Profile'
                      - type: 'null'
                  proposals:
                    type: array
                    items: { $ref: '#/components/schemas/Recommendation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/me/preferences:
    get:
      tags: [me]
      operationId: getPreferences
      summary: Get preferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [me]
      operationId: updatePreferences
      summary: Update preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/me/notification-preferences:
    get:
      tags: [me]
      operationId: getNotificationPreferences
      summary: Get reminder and quiet-hours preferences
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [me]
      operationId: updateNotificationPreferences
      summary: Update reminder and quiet-hours preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/me/consents:
    get:
      tags: [me]
      operationId: listConsents
      summary: Latest consent state per purpose (purposes never answered are omitted)
      responses:
        '200':
          description: Consents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [me]
      operationId: recordConsent
      summary: Record consent
      description: |
        Appends a row (consents are never updated) and publishes ConsentChanged. CORE_SERVICE
        cannot be withdrawn here; withdrawing it means deleting the account (409
        CORE_CONSENT_REQUIRED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, granted, policyVersion]
              properties:
                purpose: { $ref: '#/components/schemas/ConsentPurpose' }
                granted: { type: boolean }
                policyVersion: { type: string, maxLength: 20 }
                channel: { type: string, enum: [ios, android, web], default: web }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/me/flags:
    get:
      tags: [me]
      operationId: getMyFlags
      summary: The caller's evaluated feature flags
      description: |
        Every flag in the catalogue (`packages/contracts/src/flags.ts`), evaluated for this user
        from the flag document (AWS AppConfig when deployed, a JSON file locally). Web and mobile
        read every flag from here and fall back to their `FEATURE_<KEY>` env defaults on failure.
      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlagsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/sessions/revoke:
    post:
      tags: [me]
      operationId: revokeAllSessions
      summary: Sign out of all devices
      description: |
        Records a per-user cut-off in Redis so every service rejects the user's access tokens
        issued until now (401 before they expire), then calls Cognito GlobalSignOut so no device
        can refresh. Signing in again afterwards works as usual (TAC-8).
      responses:
        '204': { description: Every session ended }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503':
          description: |
            IDENTITY_UNAVAILABLE. The cut-off holds, but Cognito could not be reached to stop the
            refresh tokens; the app asks the user to try again.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/me/exports:
    post:
      tags: [me]
      operationId: requestExport
      summary: Request a full data export
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/exports/{id}:
    get:
      tags: [me]
      operationId: getExport
      summary: Get export
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Export status and download URL when ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/devices:
    post:
      tags: [me]
      operationId: registerDevice
      summary: Register device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, pushToken, appVersion]
              properties:
                platform: { type: string, enum: [IOS, ANDROID, WEB] }
                pushToken: { type: string, maxLength: 255 }
                appVersion: { type: string, maxLength: 20 }
      responses:
        '204': { description: Registered }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/onboarding/questionnaire:
    get:
      tags: [onboarding]
      operationId: getQuestionnaire
      summary: Versioned onboarding and safety questions
      responses:
        '200':
          description: Questionnaire
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/onboarding/draft:
    put:
      tags: [onboarding]
      operationId: saveOnboardingDraft
      summary: Save onboarding draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial OnboardingInput
      responses:
        '204': { description: Saved }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/onboarding/complete:
    post:
      tags: [onboarding]
      operationId: completeOnboarding
      summary: Validate answers, save profile and assessment, then create plan and targets (saga)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingInput' }
      responses:
        '201':
          description: Onboarding completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingResult' }
        '202':
          description: Profile saved; plan or targets still being created. Poll /v1/onboarding/status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/onboarding/status:
    get:
      tags: [onboarding]
      operationId: getOnboardingStatus
      summary: Onboarding progress, with the result once READY
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: List exercises
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: muscle, in: query, schema: { type: string } }
        - { name: equipment, in: query, schema: { type: string } }
        - { name: pattern, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of exercises
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ExerciseSummary' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/exercises/{slug}:
    get:
      tags: [exercises]
      operationId: getExercise
      summary: Get exercise
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Exercise detail
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/workout-plans/current:
    get:
      tags: [workouts]
      operationId: getCurrentPlan
      summary: Get current plan
      responses:
        '200':
          description: Active plan with the current week
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/workout-plans/current/weeks/{weekStart}:
    get:
      tags: [workouts]
      operationId: getPlanWeek
      summary: Get plan week
      parameters:
        - { name: weekStart, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Plan week
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanWeek' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/workout-plans/regenerate:
    post:
      tags: [workouts]
      operationId: proposeRegeneratedPlan
      summary: Propose a new plan after profile changes (applied only on accept)
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recommendation' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/workout-sessions:
    get:
      tags: [workouts]
      operationId: listSessions
      summary: List sessions
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SessionStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkoutSession' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/workout-sessions/{id}:
    get:
      tags: [workouts]
      operationId: getSession
      summary: Get session
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Session with planned exercises and logged sets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/workout-sessions/{id}/start:
    post:
      tags: [workouts]
      operationId: startSession
      summary: Start session
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/workout-sessions/{id}/sets:
    put:
      tags: [workouts]
      operationId: upsertSets
      summary: Idempotent batch upsert of sets keyed by clientId (offline sync)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sets]
              properties:
                sets:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/SetInput' }
      responses:
        '200':
          description: Stored sets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkoutSet' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/workout-sessions/{id}/complete:
    post:
      tags: [workouts]
      operationId: completeSession
      summary: Complete session
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                perceivedDifficulty: { type: integer, minimum: 1, maximum: 10 }
                soreness: { type: integer, minimum: 1, maximum: 5 }
                notes: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Completed with PRs
          content:
            application/json:
              schema:
                type: object
                required: [session, personalRecords]
                properties:
                  session: { $ref: '#/components/schemas/WorkoutSession' }
                  personalRecords:
                    type: array
                    items: { $ref: '#/components/schemas/PersonalRecord' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/workout-sessions/{id}/exercises/{plannedExerciseId}/substitutions:
    post:
      tags: [workouts]
      operationId: suggestSubstitutions
      summary: Suggest substitutions
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: plannedExerciseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [equipment_unavailable, too_difficult, discomfort, preference] }
                unavailableEquipment:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Up to 5 engine-ranked substitutes
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: '#/components/schemas/ExerciseSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/workout-sessions/{id}/exercises/{plannedExerciseId}:
    put:
      tags: [workouts]
      operationId: applySubstitution
      summary: Apply substitution
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: plannedExerciseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [exerciseId]
              properties:
                exerciseId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated planned exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedExercise' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/foods:
    get:
      tags: [nutrition]
      operationId: searchFoods
      summary: Search foods
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: includeIncompatible, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Foods ranked for this user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FoodSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [nutrition]
      operationId: createCustomFood
      summary: Create a private custom food
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFoodInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/foods/{id}:
    get:
      tags: [nutrition]
      operationId: getFood
      summary: Get food
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Food with nutrients per 100 g and units
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/foods/barcode/{code}:
    get:
      tags: [nutrition]
      operationId: lookupBarcode
      summary: Lookup barcode
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[0-9]{8,14}$' } }
      responses:
        '200':
          description: Food for barcode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/nutrition/days/{date}:
    get:
      tags: [nutrition]
      operationId: getNutritionDay
      summary: Get nutrition day
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Entries, totals and targets for a day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NutritionDay' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/nutrition/entries:
    post:
      tags: [nutrition]
      operationId: logFood
      summary: Log food
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MealEntryInput' }
      responses:
        '201':
          description: Logged entry with nutrient snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealEntry' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/nutrition/entries/{id}:
    patch:
      tags: [nutrition]
      operationId: updateEntry
      summary: Update entry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                quantity: { type: number, exclusiveMinimum: 0, maximum: 5000 }
                unitCode: { type: string, maxLength: 20 }
                state: { $ref: '#/components/schemas/FoodState' }
                slot: { $ref: '#/components/schemas/MealSlot' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [nutrition]
      operationId: deleteEntry
      summary: Delete entry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/nutrition/water:
    post:
      tags: [nutrition]
      operationId: logWater
      summary: Log water
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [date, ml]
              properties:
                date: { type: string, format: date }
                ml: { type: integer, minimum: 1, maximum: 5000 }
                clientId: { type: string, format: uuid }
      responses:
        '201': { description: Logged }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/nutrition/targets/current:
    get:
      tags: [nutrition]
      operationId: getCurrentTargets
      summary: Get current targets
      responses:
        '200':
          description: Current targets with rationale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NutritionTarget' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/nutrition/alternatives:
    get:
      tags: [nutrition]
      operationId: getMealAlternatives
