# External Secrets Operator: syncs AWS Secrets Manager into Kubernetes Secrets. Each environment's
# SecretStore (aura-platform chart) assumes a role limited to auracoach/<env>/*.
installCRDs: true
replicaCount: 1
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 192Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
serviceMonitor:
  enabled: false
