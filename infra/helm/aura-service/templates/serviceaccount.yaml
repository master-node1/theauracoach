apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aura.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Pods never call the Kubernetes API.
automountServiceAccountToken: false
