{{- if and (eq .Values.secrets.source "externalSecret") (include "aura.hasAppSecret" .) }}
{{- $name := include "aura.name" . -}}
{{- $prefix := required "global.secrets.prefix is required, e.g. auracoach/prod" .Values.global.secrets.prefix -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.global.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.global.secrets.storeName }}
  target:
    name: {{ $name }}-env
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s/%s" $prefix $name }}
        property: {{ . }}
    {{- end }}
    {{- range .Values.secrets.sharedKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s/shared" $prefix }}
        property: {{ . }}
    {{- end }}
{{- end }}
