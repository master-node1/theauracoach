{{- range $envName, $env := .Values.environments }}
{{- range include "aura-platform.namespacesOf" (dict "ctx" $ "env" $env) | fromYamlArray }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    {{- include "aura-platform.labels" $ | nindent 4 }}
    environment: {{ $envName }}
    # Every AuraCoach pod meets the restricted Pod Security Standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
# Nothing reaches or leaves a pod unless a policy allows it (aura-service and aura-datastores charts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ . }}
  labels:
    {{- include "aura-platform.labels" $ | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicy: Applies to every pod in the namespace, by design.
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ . }}
  labels:
    {{- include "aura-platform.labels" $ | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/dangling-networkpolicy: Applies to every pod in the namespace, by design.
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.dns.podLabels | nindent 14 }}
---
# External Secrets reads only this environment's secrets: the role it assumes may read
# auracoach/{{ $envName }}/* and nothing else, so dev cannot read staging on the shared node.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ . }}
  labels:
    {{- include "aura-platform.labels" $ | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $.Values.region }}
      role: {{ $env.secretsRoleArn | quote }}
{{- end }}
{{- end }}
