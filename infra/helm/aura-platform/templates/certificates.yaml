{{- if .Values.acme.enabled }}
{{- range $envName, $env := .Values.environments }}
---
# Origin TLS. CloudFront terminates public TLS and re-encrypts to this certificate (ADR-007). It forwards
# the viewer Host, so it checks the certificate against the public hosts; it covers all of this
# environment's and lives in the edge namespace next to the IngressRoutes that use it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: origin-tls
  namespace: {{ printf "%s%s" $env.namespacePrefix $.Values.namespaces.edge }}
  labels:
    {{- include "aura-platform.labels" $ | nindent 4 }}
    environment: {{ $envName }}
spec:
  secretName: origin-tls
  dnsNames:
    {{- range $env.hosts }}
    - {{ . | quote }}
    {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-route53
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
  labels:
    {{- include "aura-platform.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.acme.server }}
    email: {{ required "acme.email is required (deploy input)" .Values.acme.email | quote }}
    privateKeySecretRef:
      name: letsencrypt-route53-account
    solvers:
      - dns01:
          route53:
            region: {{ .Values.region }}
            hostedZoneID: {{ required "acme.hostedZoneId is required (deploy input)" .Values.acme.hostedZoneId | quote }}
{{- end }}
