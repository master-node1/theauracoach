{{- $role := required "system.secretsRoleArn is required (deploy input)" .Values.system.secretsRoleArn -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ .Values.system.namespace }}
  labels:
    {{- include "aura-platform.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      role: {{ $role | quote }}
---
# OTLP endpoint and credentials the collector (infra/k3s/values/otel-collector.yaml) exports with.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-grafana-cloud
  namespace: {{ .Values.system.namespace }}
  labels:
    {{- include "aura-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: otel-grafana-cloud
    creationPolicy: Owner
  data:
    {{- range list "GRAFANA_CLOUD_OTLP_ENDPOINT" "GRAFANA_CLOUD_INSTANCE_ID" "GRAFANA_CLOUD_API_TOKEN" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "auracoach/%s/platform" $.Values.cluster }}
        property: {{ . }}
    {{- end }}
