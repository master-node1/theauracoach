# web: Next.js user app, admin console and auth BFF (apps/web). Calls the gateway in-cluster and
# Cognito's token endpoint over 443. Image: apps/web/Dockerfile (Next.js standalone server).
kind: web
image:
  repository: auracoach/web
containerPort: 3000
# Next.js writes its fetch and image cache under .next/cache, next to the standalone server.
writablePaths: [/app/apps/web/.next/cache]
http:
  probes:
    # Answers without config or upstream calls (apps/web/src/app/api/health).
    livenessPath: /api/health
    readinessPath: /api/health
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
# Kubernetes sets HOSTNAME to the pod name; the Next.js standalone server binds to it, so pin all interfaces.
env:
  HOSTNAME: 0.0.0.0
worker:
  enabled: false
migration:
  enabled: false
secrets:
  # Read from <prefix>/web.
  keys: [SESSION_SECRET, OIDC_CLIENT_SECRET]
networkPolicy:
  fromIngressController: true
  datastores: false
  telemetry: false
  internetEgress: true
ingress:
  enabled: true
  paths: [/]
  priority: 10
