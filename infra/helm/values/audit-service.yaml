# audit-service: append-only audit log fed by events. Internal only.
# Layered after values/common.yaml and values/env/<env>.yaml. Service catalog: docs/architecture/service-catalog.md
kind: node-service
image:
  repository: auracoach/audit-service
secrets:
  keys: [DATABASE_URL, REDIS_URL]
  sharedKeys: [INTERNAL_TOKEN_SECRET]
networkPolicy:
  internetEgress: true
  awsMetadata: true
