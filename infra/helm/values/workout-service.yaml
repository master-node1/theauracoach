# workout-service: exercise library, plans, sessions, progression. Writes exercise media to S3 with the node role (Stage 1).
# Layered after values/common.yaml and values/env/<env>.yaml. Service catalog: docs/architecture/service-catalog.md
kind: node-service
image:
  repository: auracoach/workout-service
secrets:
  keys: [DATABASE_URL, REDIS_URL]
  sharedKeys: [INTERNAL_TOKEN_SECRET]
networkPolicy:
  internetEgress: true
  awsMetadata: true
