{{- if eq .Values.environment "prod" }}
{{- fail "aura-datastores is for dev and staging only; prod uses RDS and ElastiCache (ADR-007)" }}
{{- end }}
{{- if .Values.externalSecret }}
{{- $key := required "secretKey is required, e.g. auracoach/dev/datastores" .Values.secretKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datastores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-datastores.labels" (dict "ctx" . "name" "datastores") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStoreName }}
  target:
    name: datastores
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: {{ $key }}, property: POSTGRES_PASSWORD }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: {{ $key }}, property: REDIS_PASSWORD }
    {{- range .Values.databases }}
    - secretKey: {{ upper . }}_DB_PASSWORD
      remoteRef: { key: {{ $key }}, property: {{ upper . }}_DB_PASSWORD }
    {{- end }}
{{- end }}
