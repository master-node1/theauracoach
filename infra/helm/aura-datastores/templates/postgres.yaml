{{- $ctx := dict "ctx" . "name" "postgres" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-datastores.labels" $ctx | nindent 4 }}
data:
  # Runs once, on an empty data directory: one database and one login role per service (ERD §5),
  # with passwords from the datastores Secret. Same shape as infra/local/postgres-init.sh.
  10-service-databases.sh: |
    #!/bin/sh
    set -eu
    for svc in {{ join " " .Values.databases }}; do
      var="$(echo "$svc" | tr '[:lower:]' '[:upper:]')_DB_PASSWORD"
      password="$(printenv "$var")"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -v pw="$password" <<SQL
    CREATE ROLE ${svc}_svc LOGIN PASSWORD :'pw';
    CREATE DATABASE ${svc}_db OWNER ${svc}_svc;
    REVOKE ALL ON DATABASE ${svc}_db FROM PUBLIC;
    SQL
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-datastores.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aura-datastores.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-datastores.labels" $ctx | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/no-anti-affinity: Single replica by design (synthetic non-prod data).
spec:
  serviceName: postgres
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "aura-datastores.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aura-datastores.labels" $ctx | nindent 8 }}
      annotations:
        checksum/init: {{ .Values.databases | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # postgres user in the alpine image.
        {{- include "aura-datastores.podSecurity" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: datastores
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres', '-h', '127.0.0.1']
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres', '-h', '127.0.0.1']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "aura-datastores.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
{{ include "aura-datastores.networkPolicy" (dict "ctx" . "name" "postgres" "port" 5432) }}
