{{- $ctx := dict "ctx" . "name" "redis" -}}
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-datastores.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aura-datastores.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-datastores.labels" $ctx | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/no-anti-affinity: Single replica by design (synthetic non-prod data).
spec:
  serviceName: redis
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "aura-datastores.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aura-datastores.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # redis user in the alpine image.
        {{- include "aura-datastores.podSecurity" (dict "uid" 999) | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ['sh', '-c']
          # The password stays out of the process arguments: it goes into a config file on a memory-backed
          # volume, and exec makes redis-server PID 1 so it receives SIGTERM and shuts down cleanly.
          args:
            - >-
              printf 'requirepass %s\nappendonly yes\ndir /data\nmaxmemory {{ .Values.redis.maxmemory }}\nmaxmemory-policy noeviction\n'
              "$REDIS_PASSWORD" > /run/redis/redis.conf && exec redis-server /run/redis/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: datastores, key: REDIS_PASSWORD }
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: { name: datastores, key: REDIS_PASSWORD }
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "aura-datastores.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /run/redis
      volumes:
        - name: config
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
{{ include "aura-datastores.networkPolicy" (dict "ctx" . "name" "redis" "port" 6379) }}
